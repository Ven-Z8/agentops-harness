  - <<: *base
    id: AO-P1
    title: Trust and Benchmark Integrity
    kind: phase
    parent_id: AO-14D
    blocker: release-blocking
    outcome: Phase 1 establishes evidence and boundary gates before later roadmap work is considered.
    scope: [Coordinate confirmed Days 1 and 2, Require truthful evidence before Phase 2 work proceeds.]
    non_goals: [Implement deferred Phase 2 work, Change runtime behavior through coordination records.]
    acceptance_criteria: [Day 1 and Day 2 records are confirmed and reviewable, Phase gate evidence is explicit.]
    required_evidence: [Validated child task records, Phase gate verification results.]
    terminal_semantics: Failed, blocked, or inconclusive Phase 1 work prevents opening its downstream gate and cannot imply completion.
    compatibility: Additive phase metadata preserves existing configuration and CLI contracts.
    risks: [False-success phase status could authorize unsafe downstream work, Existing evidence references must remain readable.]
    rollback: Revert the Phase 1 coordination slice while retaining truthful child evidence.
  - <<: *base
    id: AO-P2
    title: Experiment Kernel and DeepEval
    kind: phase
    parent_id: AO-14D
    maturity: needs-revalidation
    priority: P1
    risk: high
    blocker: deferred until Phase 1 gate
    outcome: Revalidate the experiment-kernel scope after Phase 1 evidence before committing implementation claims.
    scope: [Assess Days 3 through 5 against the then-current repository, Define only confirmed kernel work.]
    non_goals: [Assert historical defects remain present, Start work before the Phase 1 gate.]
    dependencies: [AO-P1]
    acceptance_criteria: [Revalidation records current evidence, Any implemented scope is approved from that evidence.]
    required_evidence: [Phase 1 gate result, Current repository and test evidence.]
    terminal_semantics: Failed, blocked, or inconclusive revalidation prevents Phase 2 promotion and cannot imply kernel readiness.
    compatibility: Any future persisted-schema or provider migration is deferred until revalidation confirms it.
    risks: [Stale assumptions can cause false success, Future schema changes require backward-compatible readers.]
    rollback: Revert only confirmed Phase 2 coordination updates while preserving recorded revalidation evidence.
