    day: null
    phase_id: null
    parent_id: null
    status: planned
    maturity: confirmed
    priority: P0
    risk: critical
    blocker: release-blocking
    outcome: A reviewable 14-day control-plane roadmap keeps approved scope and evidence authoritative in Git.
    scope: [Maintain stable roadmap identifiers, Render approved roadmap scope deterministically.]
    non_goals: [Change AgentOps runtime behavior, Treat GitHub issue text as the roadmap authority.]
    dependencies: []
    acceptance_criteria: [All approved roadmap records validate, Generated Markdown identifies its authoritative YAML source.]
    required_evidence: [Validated roadmap YAML, Byte-stable rendered Markdown.]
    likely_files: []
    test_first: null
    terminal_semantics: Failed, blocked, or inconclusive roadmap evidence cannot be reported as a completed release plan.
    compatibility: Additive coordination metadata does not alter persisted AgentOps runtime records or CLI behavior.
    verification_commands: [uv run pytest tests/unit/test_project_control_schema.py tests/unit/test_project_control_rendering.py -q, uv run ruff check app/project_control]
    risks: [False-success reporting could hide missing roadmap evidence, Existing coordination consumers require additive migration only.]
    rollback: Revert the coordination roadmap slice while preserving committed truthful evidence and prior generated artifacts.
