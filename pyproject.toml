[project]
name = "agentops-harness"
version = "0.1.0"
description = "Local-first coding-agent orchestration and evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "mcp>=1.16.0",
    "openai>=1.99.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[project.scripts]
agentops = "app.cli:app"
agentops-mcp = "app.mcp_server:main"
agentops-vault-mcp = "app.vault_mcp:main"
agentops-scripted-edit = "app.core.workers.scripted_worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
