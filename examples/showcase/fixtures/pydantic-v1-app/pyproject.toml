[project]
name = "pydantic-v1-migration-fixture"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  'ignore:Pydantic V1 style `@validator` validators are deprecated.*:pydantic.warnings.PydanticDeprecatedSince20',
  'ignore:Support for class-based `config` is deprecated.*:pydantic.warnings.PydanticDeprecatedSince20',
  'ignore:Valid config keys have changed in V2:UserWarning:pydantic._internal._config',
  'ignore:The `dict` method is deprecated; use `model_dump` instead.*:pydantic.warnings.PydanticDeprecatedSince20',
  'ignore:The `from_orm` method is deprecated; set `model_config.*:pydantic.warnings.PydanticDeprecatedSince20',
]
